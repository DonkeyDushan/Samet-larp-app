# Lokální Postgres pro vývoj. Produkce běží na Neonu (§18.1).
# Port 5433, aby nekolidoval s případným systémovým Postgresem na 5432.
services:
  db:
    image: postgres:17-alpine
    container_name: samet-larp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: larp
      POSTGRES_PASSWORD: larp
      POSTGRES_DB: samet_larp
    ports:
      - '5433:5432'
    volumes:
      - larp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U larp -d samet_larp']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  larp-pgdata:
